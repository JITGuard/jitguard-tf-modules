name: Terraform

# No AWS credentials are configured here, deliberately. This repository is public and
# generic: module validation is static only, and applying anything is a consumer's job.
#
# Each module is validated in its own directory. There is deliberately no root module
# here, so a root-level `terraform validate` would succeed while checking nothing —
# a guard that cannot fail is worse than no guard.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate each module
        run: |
          set -euo pipefail
          shopt -s nullglob
          modules=(modules/*/)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "::error::no modules found under modules/ — nothing was validated"
            exit 1
          fi
          for dir in "${modules[@]}"; do
            echo "::group::$dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
            echo "::endgroup::"
          done

      - name: tflint
        run: |
          set -euo pipefail
          shopt -s nullglob
          # v0.64.0, not the v0.39.3 the consuming repos pin: v0.39.3 cannot parse
          # `optional(type, default)`, which these modules use. See .tflint.hcl.
          curl -sSL -o /tmp/tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip"
          sudo unzip -oq /tmp/tflint.zip -d /usr/local/bin
          config="$(realpath .tflint.hcl)"
          modules=(modules/*/)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "::error::no modules found under modules/ — tflint checked nothing"
            exit 1
          fi
          for dir in "${modules[@]}"; do
            (cd "$dir" && tflint --no-color --config="$config")
          done

      - name: Trivy config scan
        # The trivy binary pinned directly, matching jitguard/jitguard-auth/jitguard-billing,
        # rather than the aquasecurity/trivy-action. Same version as those repos (v0.69.3) so
        # a misconfiguration is reported identically wherever it is found, and no third-party
        # action sits in this repository's supply chain.
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz"
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy config --severity HIGH,CRITICAL --skip-version-check --exit-code 1 .
