name: Terraform

# No AWS credentials are configured here, deliberately. This repository is public and
# generic: module validation is static only, and applying anything is a consumer's job.
#
# Each module is validated in its own directory, or through its `examples/*` roots when
# it has them (a module that takes a provider alias cannot validate in place, because the
# alias has no configuration). There is deliberately no root module here, so a root-level
# `terraform validate` would succeed while checking nothing — a guard that cannot fail is
# worse than no guard.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate each module
        run: |
          set -euo pipefail
          shopt -s nullglob
          modules=(modules/*/)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "::error::no modules found under modules/ — nothing was validated"
            exit 1
          fi
          for dir in "${modules[@]}"; do
            # A module that requires a provider alias cannot validate in place:
            # the alias has no configuration. Those modules ship example roots,
            # which wire the alias up and still validate every resource.
            roots=("${dir}examples/"*/)
            if [ ${#roots[@]} -eq 0 ]; then
              roots=("$dir")
            fi
            for root in "${roots[@]}"; do
              echo "::group::$root"
              (cd "$root" && terraform init -backend=false -input=false && terraform validate)
              echo "::endgroup::"
            done
          done

      - name: Test each module with tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          modules=(modules/*/)
          for dir in "${modules[@]}"; do
            tests=("${dir}tests/"*.tftest.hcl)
            [ ${#tests[@]} -eq 0 ] && continue
            echo "::group::$dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform test)
            echo "::endgroup::"
          done

      - name: tflint
        run: |
          set -euo pipefail
          shopt -s nullglob
          config="$(realpath .tflint.hcl)"
          modules=(modules/*/)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "::error::no modules found under modules/ — tflint checked nothing"
            exit 1
          fi
          for dir in "${modules[@]}"; do
            (cd "$dir" && tflint-0.64.0 --no-color --config="$config")
          done

      - name: Trivy config scan
        # The trivy binary comes from the self-hosted runner image (same
        # version v0.69.3 honestly pinned there), rather than the
        # aquasecurity/trivy-action, so no third-party action sits in this
        # repository's supply chain.
        run: |
          set -euo pipefail
          trivy config --severity HIGH,CRITICAL --skip-version-check --exit-code 1 .
